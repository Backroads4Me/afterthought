[project]
name = "afterthought"
version = "0.1.0"
description = "Shared, evidence-backed memory for coding agents, kept as OKF markdown in git."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
aft = "aft.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aft"]

[tool.hatch.build.targets.wheel.force-include]
"integrations" = "aft/integrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "timing: asserts a wall-clock budget (DESIGN 8, 10); a default run includes it, and a loaded host leaves it out with -m 'not timing'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
